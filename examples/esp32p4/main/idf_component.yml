## IDF Component Manager Manifest File
dependencies:
  idf: ">=5.5.2,<5.6"

  # LCD display driver (EK79007 MIPI DSI)
  espressif/esp_lcd_ek79007:
    version: "1.0.4"
    public: true

  # Touch panel driver (GT911 I2C)
  espressif/esp_lcd_touch_gt911:
    version: "1.2.0~2"
    public: true

  # LVGL graphics library
  lvgl/lvgl:
    version: "9.5.0"
    public: true

  # FreeType font rendering
  espressif/freetype:
    version: "2.14.2"
    public: true

  # Pin the transitive registry packages used by the measured P4 baseline.
  espressif/cmake_utilities: "0.5.3"
  espressif/esp_mmap_assets: "2.0.0"
  espressif/esp_new_jpeg: "1.0.2"
  espressif/libpng: "1.6.58"
  espressif/zlib: "1.3.2"
